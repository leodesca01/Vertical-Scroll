org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
org.gradle.configuration-cache=false
org.gradle.dependency.verification.snapshot.cache.hours=0

# Default build target. Override on the command line: -Pmc_target=26.1
mc_target=1.21.x

# To build for 26.1, Java 25 is required (Loom enforces this for MC 26.1).
# Install JDK 25 and uncomment + update the path below before running -Pmc_target=26.1:
org.gradle.java.home=C:/Program Files/Java/jdk-25

# 1.15-SNAPSHOT supports both 1.21.x and 26.1 (1.15.5 predates 26.1 and lacks unobfuscated support)
loom_version=1.15-SNAPSHOT

mod_version=1.1.0
maven_group=io.redstonerdev
archives_base_name=verticalscroll
