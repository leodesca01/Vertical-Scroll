plugins {
    // apply false: we apply the correct variant below based on mc_target.
    // 'fabric-loom'             = LoomGradlePlugin       (obfuscated MC, needs mappings)
    // 'net.fabricmc.fabric-loom' = LoomNoRemapGradlePlugin (unobfuscated MC 26.1.x+, sets disableObfuscation=true)
    id 'fabric-loom' version "${loom_version}" apply false
    id 'maven-publish'
}

apply from: 'versions.gradle'

// ── Select target profile ─────────────────────────────────────────────────────
def targetKey = project.findProperty('mc_target') ?: '1.21.x'
def v = MC_PROFILES[targetKey]
if (!v) throw new GradleException(
    "Unknown mc_target '${targetKey}'. Available: ${MC_PROFILES.keySet().join(', ')}"
)

// Apply the correct Loom plugin variant BEFORE the extension is first read.
// LoomNoRemapGradlePlugin (net.fabricmc.fabric-loom) sets disableObfuscation=true at
// extension construction time, bypassing the "mappings has no dependencies" check.
if (v.mappings == 'none') {
    apply plugin: 'net.fabricmc.fabric-loom'
} else {
    apply plugin: 'fabric-loom'
}

version = project.mod_version
group   = project.maven_group

base {
    archivesName = project.archives_base_name
}

// Include version-specific sources (Mojang names for 26.1, yarn names for 1.21.x)
sourceSets.main.java.srcDir "src/${v.srcDir}/java"

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    maven { url 'https://maven.terraformersmc.com/' }
    maven { url 'https://maven.nucleoid.xyz/' }  // eu.pb4 (transitive dep of modmenu 18.x)
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${v.minecraft}"

    if (v.mappings == 'yarn') {
        mappings "net.fabricmc:yarn:${v.yarn}:v2"
        modImplementation "net.fabricmc:fabric-loader:${v.loader}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${v.fabricApi}"
        modCompileOnly    "com.terraformersmc:modmenu:${v.modmenu}"
    } else if (v.mappings == 'mojang') {
        mappings loom.officialMojangMappings()
        modImplementation "net.fabricmc:fabric-loader:${v.loader}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${v.fabricApi}"
        modCompileOnly    "com.terraformersmc:modmenu:${v.modmenu}"
    } else {
        // 'none': unobfuscated (26.1+) — no mappings, plain implementation
        implementation "net.fabricmc:fabric-loader:${v.loader}"
        implementation "net.fabricmc.fabric-api:fabric-api:${v.fabricApi}"
        compileOnly    "com.terraformersmc:modmenu:${v.modmenu}"
    }
}

processResources {
    // fabric-api is required for mapped builds (1.21.x) but not for unobfuscated ones (26.1.x),
    // since KeyMapping self-registers in MC 26.1+ and no Fabric API code is called.
    def fabricApiDep = (v.mappings == 'none') ? '' : ',\n    "fabric-api": "*"'
    inputs.property 'version', project.version
    inputs.property 'fabricApiDep', fabricApiDep
    filteringCharset 'UTF-8'
    filesMatching('fabric.mod.json') {
        expand version: project.version, fabric_api_dep: fabricApiDep
    }
}

def javaVersion = v.java as int

tasks.withType(JavaCompile).configureEach {
    it.options.release = javaVersion
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion)
    }
    withSourcesJar()
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
